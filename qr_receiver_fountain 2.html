<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR RX — Fountain Receiver</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR RX">
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap');

:root {
  --bg:      #0d0f12;
  --surface: #111520;
  --border:  #1e2540;
  --accent:  #00e5ff;
  --accent2: #f5a623;
  --ok:      #00e676;
  --warn:    #ffcc00;
  --err:     #ff4444;
  --text:    #c8d8f0;
  --dim:     #3a4a6a;
  --mono:    'Share Tech Mono', monospace;
  --display: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.012) 2px, rgba(0,229,255,0.012) 4px);
  pointer-events: none; z-index: 100;
}

.wrapper {
  position: relative; z-index: 1;
  width: 100%; max-width: 500px;
  padding: 20px 14px 48px;
  display: flex; flex-direction: column; gap: 14px;
}

/* Header */
header { text-align: center; padding: 20px 0 8px; }

.logo {
  font-family: var(--display);
  font-size: 26px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 24px rgba(0,229,255,0.35);
}
.logo span { color: var(--accent2); }
.subtitle {
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--dim); margin-top: 4px;
  text-transform: uppercase;
}

/* Install banner */
.install-banner {
  display: none;
  align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(245,166,35,0.08);
  border: 1px solid rgba(245,166,35,0.3);
  border-radius: 6px;
  font-size: 12px; color: var(--accent2);
}
.install-banner.show { display: flex; }
.install-banner button {
  margin-left: auto; padding: 4px 10px;
  background: var(--accent2); color: #000;
  border: none; border-radius: 3px;
  font-family: var(--mono); font-size: 11px;
  cursor: pointer; font-weight: 600;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.card-header {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 13px; border-bottom: 1px solid var(--border);
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--dim);
}
.card-header .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  flex-shrink: 0;
}

/* Camera */
.cam-wrap {
  position: relative; width: 100%; aspect-ratio: 1;
  background: #000; overflow: hidden;
}
#video { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Corner brackets */
.cam-wrap::before, .cam-wrap::after,
.cam-inner::before, .cam-inner::after {
  content: ''; position: absolute;
  width: 20px; height: 20px;
  border-color: var(--accent); border-style: solid; z-index: 10;
}
.cam-wrap::before  { top:8px; left:8px;   border-width:2px 0 0 2px; }
.cam-wrap::after   { top:8px; right:8px;  border-width:2px 2px 0 0; }
.cam-inner::before { bottom:8px; left:8px;  border-width:0 0 2px 2px; }
.cam-inner::after  { bottom:8px; right:8px; border-width:0 2px 2px 0; }

.scan-line {
  position: absolute; left:8px; right:8px; height:2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  box-shadow: 0 0 10px var(--accent);
  animation: scan 2s linear infinite; z-index: 11;
  opacity: 0; transition: opacity 0.3s;
}
.scanning .scan-line { opacity: 1; }
@keyframes scan { 0%{top:8px} 100%{top:calc(100% - 10px)} }

.flash-overlay {
  position: absolute; inset:0;
  background: rgba(0,229,255,0.2);
  opacity:0; pointer-events:none; z-index:12;
  transition: opacity 0.04s;
}
.flash-overlay.flash { opacity:1; }

/* Debug overlay */
.debug-bar {
  position: absolute; bottom:6px; left:6px; right:6px;
  background: rgba(0,0,0,0.75); border-radius:3px;
  padding: 3px 8px; font-size:10px; color:var(--accent);
  z-index:13; pointer-events:none;
}

/* Status */
.status-bar {
  display: flex; align-items: center; gap:10px;
  padding: 9px 13px;
  background: rgba(0,229,255,0.03);
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.status-dot {
  width:7px; height:7px; border-radius:50%;
  background: var(--dim); flex-shrink:0;
  transition: all 0.2s;
}
.status-dot.active { background:var(--ok); box-shadow:0 0 7px var(--ok); animation:pulse 1s infinite; }
.status-dot.warn   { background:var(--warn); box-shadow:0 0 7px var(--warn); }
.status-dot.err    { background:var(--err); box-shadow:0 0 7px var(--err); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* Buttons */
.btn-row { display:flex; gap:8px; padding:12px; padding-top:0; }
.btn {
  flex:1; padding:10px 8px;
  border:1px solid var(--border); border-radius:4px;
  background:transparent; color:var(--text);
  font-family:var(--mono); font-size:11px;
  letter-spacing:0.1em; cursor:pointer;
  text-transform:uppercase; transition:all 0.15s;
}
.btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,0.05); }
.btn-primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
.btn-primary:hover { background:#33ecff; color:#000; }
.btn-danger { border-color:var(--err); color:var(--err); }
.btn-danger:hover { background:rgba(255,68,68,0.1); }

/* Progress */
.progress-wrap { padding:13px; display:flex; flex-direction:column; gap:9px; }
.progress-header { display:flex; justify-content:space-between; font-size:11px; }
.progress-label { color:var(--dim); }
.progress-count { color:var(--accent); font-weight:600; }
.progress-track { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.progress-fill {
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  border-radius:3px; transition:width 0.3s;
}

/* Meta info */
.meta-card {
  display:none;
  padding:12px;
  background:rgba(0,229,255,0.04);
  border-top:1px solid var(--border);
  font-size:11px; color:var(--dim);
  gap:6px; flex-direction:column;
}
.meta-card.show { display:flex; }
.meta-row { display:flex; justify-content:space-between; }
.meta-val { color:var(--accent); }

/* Block grid */
.block-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(20px,1fr));
  gap:2px; padding:12px;
  max-height:100px; overflow-y:auto;
}
.block-cell {
  aspect-ratio:1; border-radius:2px;
  background:var(--border); transition:background 0.2s;
}
.block-cell.got { background:var(--ok); box-shadow:0 0 4px rgba(0,230,118,0.4); }

/* Complete */
.complete-banner {
  display:none;
  background:linear-gradient(135deg,rgba(0,230,118,0.08),rgba(0,229,255,0.08));
  border:1px solid var(--ok);
  border-radius:6px; padding:24px;
  text-align:center; flex-direction:column;
  align-items:center; gap:12px;
}
.complete-banner.show { display:flex; }
.complete-icon { font-size:44px; filter:drop-shadow(0 0 14px var(--ok)); }
.complete-title {
  font-family:var(--display); font-size:22px; font-weight:800;
  color:var(--ok); letter-spacing:0.08em;
}
.complete-meta { font-size:11px; color:var(--dim); line-height:1.9; }
.btn-ok { background:var(--ok); color:#000; border-color:var(--ok); font-weight:600; }
.btn-ok:hover { background:#33ffaa; color:#000; }

/* Log */
.log-area {
  font-size:10px; line-height:1.8; color:var(--dim);
  padding:10px 13px; max-height:110px; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.log-ok   { color:var(--ok); }
.log-warn { color:var(--warn); }
.log-err  { color:var(--err); }
.log-info { color:var(--accent); }

canvas { display:none; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo">QR <span>RX</span></div>
    <div class="subtitle">Fountain Code File Receiver — v2.0</div>
  </header>

  <!-- PWA install hint -->
  <div class="install-banner" id="installBanner">
    📲 添加到主屏幕可离线使用
    <button onclick="installPWA()">添加</button>
  </div>

  <!-- Camera -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>摄像头扫描</div>
    <div style="padding:8px">
      <div class="cam-wrap scanning" id="camWrap">
        <div class="cam-inner"></div>
        <video id="video" playsinline autoplay muted></video>
        <div class="scan-line"></div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="debug-bar" id="debugBar">等待启动…</div>
      </div>
      <canvas id="canvas"></canvas>
      <canvas id="canvas2"></canvas>
    </div>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <div id="statusText">点击启动摄像头</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn" onclick="startCamera()">▶ 启动摄像头</button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopCamera()" disabled>■ 停止</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>接收进度</div>

    <div class="meta-card" id="metaCard">
      <div class="meta-row">
        <span>文件名</span><span class="meta-val" id="metaName">—</span>
      </div>
      <div class="meta-row">
        <span>原始大小</span><span class="meta-val" id="metaSize">—</span>
      </div>
      <div class="meta-row">
        <span>数据块数</span><span class="meta-val" id="metaK">—</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label">已解码块数</span>
        <span class="progress-count" id="progressCount">0 / —</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="block-grid" id="blockGrid"></div>
  </div>

  <!-- Complete -->
  <div class="complete-banner" id="completeBanner">
    <div class="complete-icon">✦</div>
    <div class="complete-title">接收完成</div>
    <div class="complete-meta" id="completeMeta"></div>
    <button class="btn btn-ok" onclick="downloadFile()">⬇ 下载文件</button>
    <button class="btn" onclick="resetAll()" style="margin-top:4px">↺ 重新接收</button>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>日志</div>
    <div class="log-area" id="logArea"></div>
    <div class="btn-row">
      <button class="btn" onclick="resetAll()">↺ 重置</button>
      <button class="btn" onclick="document.getElementById('logArea').innerHTML=''">清除</button>
    </div>
  </div>
</div>

<script>
(function() {
  var cdns = [
    'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',
    'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js'
  ];
  var idx = 0;
  function tryLoad() {
    if (idx >= cdns.length) return;
    var s = document.createElement('script');
    s.src = cdns[idx++];
    s.onerror = tryLoad;
    document.head.appendChild(s);
  }
  tryLoad();
})();
</script>
<script>
// ─── Fountain Code 解码器 ─────────────────────────────────────────────────────
// 使用高斯消元法还原数据块

class FountainDecoder {
  constructor(K, blockSize) {
    this.K = K;
    this.blockSize = blockSize;
    this.decoded = new Array(K).fill(null);  // 已还原的块
    this.decodedCount = 0;
    this.equations = [];  // 待处理方程：{indices, data}
    this.dirty = true;
  }

  addFrame(indices, data) {
    // 过滤掉已解码的块
    const remaining = indices.filter(i => this.decoded[i] === null);
    if (remaining.length === 0) return false; // 没用的帧

    let frameData = new Uint8Array(data);

    // XOR 掉已知块
    for (const i of indices) {
      if (this.decoded[i] !== null) {
        for (let j = 0; j < this.blockSize; j++) {
          frameData[j] ^= this.decoded[i][j];
        }
      }
    }

    if (remaining.length === 1) {
      // 单块方程，直接解
      this.decoded[remaining[0]] = frameData;
      this.decodedCount++;
      this.dirty = true;
      return true;
    }

    // 多块方程，存起来等消元
    this.equations.push({ indices: remaining, data: frameData });
    return false;
  }

  // 尝试用已解码的块简化方程，返回新解码数量
  propagate() {
    if (!this.dirty) return 0;
    this.dirty = false;

    let progress = true;
    let total = 0;

    while (progress) {
      progress = false;
      const newEqs = [];

      for (const eq of this.equations) {
        // 过滤已解码的
        const remaining = eq.indices.filter(i => this.decoded[i] === null);
        const data = new Uint8Array(eq.data);

        for (const i of eq.indices) {
          if (this.decoded[i] !== null) {
            for (let j = 0; j < this.blockSize; j++) {
              data[j] ^= this.decoded[i][j];
            }
          }
        }

        if (remaining.length === 0) {
          // 方程已满足
        } else if (remaining.length === 1) {
          // 解出新块
          this.decoded[remaining[0]] = data;
          this.decodedCount++;
          total++;
          progress = true;
          this.dirty = true;
        } else {
          newEqs.push({ indices: remaining, data });
        }
      }
      this.equations = newEqs;
    }
    return total;
  }

  isDone() { return this.decodedCount >= this.K; }

  getProgress() { return this.decodedCount / this.K; }

  assemble(originalLength) {
    // 拼接所有块
    const total = this.K * this.blockSize;
    const out = new Uint8Array(total);
    for (let i = 0; i < this.K; i++) {
      if (this.decoded[i]) out.set(this.decoded[i], i * this.blockSize);
    }
    return out.slice(0, originalLength);
  }
}

// ─── 状态 ────────────────────────────────────────────────────────────────────
const state = {
  scanning: false,
  stream: null,
  rafId: null,
  scanCount: 0,
  decodeCount: 0,
  lastRaw: null,
  lastRawTime: 0,
  recentRaws: new Set(),  // 多码去重

  // Fountain 状态
  sessionId: null,
  meta: null,
  decoder: null,
  receivedFrames: new Set(),  // 已收到的 seqId，去重
  frameCount: 0,
};

// ─── DOM ─────────────────────────────────────────────────────────────────────
const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const canvas2  = document.getElementById('canvas2');
const ctx      = canvas.getContext('2d');
const ctx2     = canvas2.getContext('2d');

// ─── 日志 ────────────────────────────────────────────────────────────────────
function log(msg, type='') {
  const ts = new Date().toTimeString().slice(0,8);
  const line = document.createElement('div');
  if (type) line.className = 'log-' + type;
  line.textContent = `[${ts}] ${msg}`;
  const la = document.getElementById('logArea');
  la.appendChild(line);
  la.scrollTop = la.scrollHeight;
}

// ─── 摄像头 ──────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:1280} }
    });
    video.srcObject = state.stream;
    await video.play();
    const s = state.stream.getVideoTracks()[0].getSettings();
    log(`摄像头已启动 ${s.width}x${s.height}`, 'info');
    state.scanning = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    setStatus('扫描中… 对准发送端屏幕', 'active');
    scheduleScan();
  } catch(e) {
    setStatus('摄像头失败: ' + e.message, 'err');
    log('错误: ' + e.message, 'err');
  }
}

function stopCamera() {
  state.scanning = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  if (state.stream) { state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
  video.srcObject = null;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  setStatus('已停止', '');
}

function scheduleScan() {
  if (!state.scanning) return;
  state.rafId = requestAnimationFrame(() => { scanFrame(); scheduleScan(); });
}

function scanFrame() {
  if (!state.scanning || video.readyState !== video.HAVE_ENOUGH_DATA) return;
  if (typeof jsQR === 'undefined') {
    document.getElementById('debugBar').textContent = 'jsQR 加载中，请稍候…';
    return;
  }
  const vw=video.videoWidth, vh=video.videoHeight;
  if (!vw||!vh) return;

  canvas.width=vw; canvas.height=vh;
  ctx.drawImage(video,0,0,vw,vh);
  state.scanCount++;

  const now = Date.now();
  let hitCount = 0;

  // 收集所有识别结果，全图 + 4象限
  const toProcess = [];

  // 全图扫一次（单码兼容 / 画面里只有1个码时）
  const fullImg = ctx.getImageData(0,0,vw,vh);
  const r0 = jsQR(fullImg.data, vw, vh, {inversionAttempts:'dontInvert'});
  if (r0) toProcess.push(r0.data);

  // 4象限分别扫（2×2网格模式，每个象限带5%重叠）
  const pad = Math.floor(Math.min(vw, vh) * 0.06);
  const hx = Math.floor(vw / 2);
  const hy = Math.floor(vh / 2);
  const quadrants = [
    [0,       0,       hx+pad,  hy+pad ],  // 左上
    [hx-pad,  0,       hx+pad,  hy+pad ],  // 右上
    [0,       hy-pad,  hx+pad,  hy+pad ],  // 左下
    [hx-pad,  hy-pad,  hx+pad,  hy+pad ],  // 右下
  ];

  for (const [sx, sy, sw, sh] of quadrants) {
    const rx = Math.max(0, sx);
    const ry = Math.max(0, sy);
    const rw = Math.min(sw, vw - rx);
    const rh = Math.min(sh, vh - ry);
    if (rw < 80 || rh < 80) continue;

    canvas2.width = rw; canvas2.height = rh;
    ctx2.drawImage(canvas, rx, ry, rw, rh, 0, 0, rw, rh);
    const result = jsQR(
      ctx2.getImageData(0, 0, rw, rh).data, rw, rh,
      {inversionAttempts:'dontInvert'}
    );
    if (result) toProcess.push(result.data);
  }

  // 去重后统一处理
  for (const raw of toProcess) {
    if (state.recentRaws.has(raw)) continue;
    state.recentRaws.add(raw);
    setTimeout(() => state.recentRaws.delete(raw), 300);
    state.decodeCount++; hitCount++;
    processFrame(raw);
  }

  // 计算实际扫描帧率
  const nowMs = Date.now();
  state.scanTimes = (state.scanTimes || []).filter(t => nowMs - t < 1000);
  state.scanTimes.push(nowMs);
  const scanFps = state.scanTimes.length;

  document.getElementById('debugBar').textContent =
    `扫描: ${state.scanCount} | ${scanFps} FPS | 识别: ${state.decodeCount} | 本帧: ${hitCount} | ${vw}x${vh}`;
}

// ─── 帧处理 ──────────────────────────────────────────────────────────────────
function processFrame(raw) {
  // 调试：显示原始内容前50字符
  document.getElementById('debugBar').textContent =
    '收到: ' + raw.slice(0,60).replace(/\n/g,'↵');

  // 格式1：META 帧 — "META|<sid>|<json>"
  if (raw.startsWith('META|')) {
    const parts = raw.split('|');
    if (parts.length < 3) return;
    const sid = parts[1];
    const json = parts.slice(2).join('|');

    // 新 session
    if (state.sessionId && state.sessionId !== sid) {
      log(`新会话 ${sid}，重置`, 'warn');
      resetDecoder();
    }

    if (!state.meta) {
      try {
        state.meta = JSON.parse(json);
        state.sessionId = sid;
        initDecoder(state.meta);
        flash();
        log(`收到元数据: ${state.meta.name} (${fmtSize(state.meta.size)}, K=${state.meta.K})`, 'info');
      } catch(e) {
        log('元数据解析失败: ' + e.message, 'err');
      }
    }
    return;
  }

  // 格式2：数据帧 — "<sid>|FTN|<K>|<seqId>|<indices>|<payload>"
  const pipeIdx = raw.indexOf('|');
  if (pipeIdx < 0) return;
  const sid = raw.slice(0, pipeIdx);
  const rest = raw.slice(pipeIdx + 1);

  if (!rest.startsWith('FTN|')) return;
  if (state.sessionId && sid !== state.sessionId) return;

  const parts = rest.split('|');
  if (parts.length < 5) return;
  // parts: ['FTN', K, seqId, indices, payload]
  const K     = parseInt(parts[1]);
  const seqId = parseInt(parts[2]);
  const idxStr = parts[3];
  const payloadB85 = parts.slice(4).join('|');

  if (isNaN(K) || isNaN(seqId)) return;

  // 去重
  if (state.receivedFrames.has(seqId)) return;
  state.receivedFrames.add(seqId);
  state.frameCount++;

  if (!state.decoder) {
    // 没有 meta 时临时初始化（用帧里的 K）
    if (!state.meta) {
      state.meta = { K, bs: 400, enc: K * 400, name: 'output.bin', size: 0 };
      state.sessionId = sid;
      initDecoder(state.meta);
    }
  }

  // 解码 payload
  try {
    const indices = idxStr.split(',').map(Number);
    const data = b85decode(payloadB85);

    const isNew = state.decoder.addFrame(indices, data);
    const newSolved = state.decoder.propagate();

    if (isNew || newSolved > 0) {
      flash();
      updateBlockGrid();
    }

    const pct = state.decoder.getProgress();
    updateProgress(pct);
    setStatus(`已收 ${state.frameCount} 帧 · 解码 ${state.decoder.decodedCount}/${K} 块`, 'active');

    if (state.decoder.isDone()) {
      onComplete();
    }
  } catch(e) {
    log('帧解码错误: ' + e.message, 'err');
  }
}

// ─── 解码器初始化 ─────────────────────────────────────────────────────────────
function initDecoder(meta) {
  state.decoder = new FountainDecoder(meta.K, meta.bs);

  document.getElementById('metaCard').classList.add('show');
  document.getElementById('metaName').textContent = meta.name;
  document.getElementById('metaSize').textContent = fmtSize(meta.size || 0);
  document.getElementById('metaK').textContent = meta.K + ' 块 × ' + meta.bs + ' B';

  initBlockGrid(meta.K);
}

function resetDecoder() {
  state.meta = null;
  state.decoder = null;
  state.sessionId = null;
  state.receivedFrames = new Set();
  state.frameCount = 0;
  document.getElementById('metaCard').classList.remove('show');
  document.getElementById('blockGrid').innerHTML = '';
  updateProgress(0);
}

// ─── 完成 ────────────────────────────────────────────────────────────────────
async function onComplete() {
  stopCamera();
  log('所有块已还原，开始重组…', 'ok');

  const { meta, decoder } = state;
  const assembled = decoder.assemble(meta.enc);  // 编码后的字节

  // Base85 解码
  const b85str = new TextDecoder().decode(assembled);
  const compressed = b85decode(b85str.replace(/\0/g, ''));

  // gzip 解压
  try {
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter(); w.write(compressed); w.close();
    const r = ds.readable.getReader(); const chunks=[];
    for(;;){const{done,value}=await r.read();if(done)break;chunks.push(value);}
    const total=chunks.reduce((s,c)=>s+c.length,0);
    const out=new Uint8Array(total); let off=0;
    for(const c of chunks){out.set(c,off);off+=c.length;}
    window._fileData = out;
    window._fileName = meta.name;

    document.getElementById('completeBanner').classList.add('show');
    document.getElementById('completeMeta').innerHTML =
      `文件名: <b>${meta.name}</b><br>大小: <b>${fmtSize(out.length)}</b>`;
    log(`还原完成: ${meta.name} (${fmtSize(out.length)})`, 'ok');
    setStatus('接收完成！', 'active');
  } catch(e) {
    log('解压失败: ' + e.message, 'err');
  }
}

function downloadFile() {
  if (!window._fileData || !window._fileName) return;
  const blob = new Blob([window._fileData]);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: window._fileName
  });
  a.click(); URL.revokeObjectURL(a.href);
  log('文件已下载: ' + window._fileName, 'ok');
}

// ─── UI 工具 ─────────────────────────────────────────────────────────────────
function setStatus(msg, type) {
  document.getElementById('statusText').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (type ? ' '+type : '');
}

function flash() {
  const f = document.getElementById('flashOverlay');
  f.classList.add('flash');
  setTimeout(()=>f.classList.remove('flash'), 60);
}

function initBlockGrid(K) {
  const grid = document.getElementById('blockGrid');
  grid.innerHTML = '';
  for (let i=0; i<K; i++) {
    const cell = document.createElement('div');
    cell.className = 'block-cell';
    cell.id = `bc-${i}`;
    grid.appendChild(cell);
  }
}

function updateBlockGrid() {
  if (!state.decoder) return;
  for (let i=0; i<state.decoder.K; i++) {
    if (state.decoder.decoded[i]) {
      const cell = document.getElementById(`bc-${i}`);
      if (cell) cell.classList.add('got');
    }
  }
  document.getElementById('progressCount').textContent =
    `${state.decoder.decodedCount} / ${state.decoder.K}`;
}

function updateProgress(pct) {
  document.getElementById('progressFill').style.width = (pct*100) + '%';
}

function resetAll() {
  stopCamera();
  resetDecoder();
  state.recentRaws = new Set();
  document.getElementById('completeBanner').classList.remove('show');
  window._fileData = null; window._fileName = null;
  setStatus('已重置', '');
  document.getElementById('debugBar').textContent = '已重置';
  log('─── 重置 ───', 'info');
}

// ─── Base85 解码（Python b85encode 兼容）────────────────────────────────────
const B85CS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;<=>?@^_`{|}~';
const B85MAP = {};
for (let i=0; i<B85CS.length; i++) B85MAP[B85CS[i]] = i;

function b85decode(str) {
  str = str.split('').filter(c=>B85MAP[c]!==undefined).join('');
  const bytes = [];
  for (let i=0; i<str.length; i+=5) {
    const chunk = str.slice(i, i+5);
    const chunkLen = chunk.length;
    const padded = chunk + '~'.repeat(5-chunkLen);
    let val = 0;
    for (const ch of padded) val = val*85 + B85MAP[ch];
    const bc = chunkLen===5 ? 4 : chunkLen-1;
    for (let j=0; j<4; j++) {
      if (j<bc) bytes.push((val>>>(8*(3-j)))&0xff);
    }
  }
  return new Uint8Array(bytes);
}

// ─── 工具 ────────────────────────────────────────────────────────────────────
function fmtSize(b) {
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}

// ─── PWA ─────────────────────────────────────────────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  }
}

// Service Worker 注册
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    log('离线缓存已就绪 ✓', 'ok');
  }).catch(e => {
    log('SW 注册失败: ' + e.message, 'warn');
  });
}

// 初始化
log('QR RX v2.0 (Fountain) 已加载', 'info');
setStatus('点击启动摄像头', '');
